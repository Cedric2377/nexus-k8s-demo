# Persistent Volume configuration for NFS
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nexus-nfs-pv
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  nfs:
    path: /srv/nfs/nexus-data
    server: <your-host-ip>  # Replace with your local host IP (e.g., 192.168.1.100)
  persistentVolumeReclaimPolicy: Retain


#Replace <NFS_SERVER_IP> with the actual IP address of your NFS server. This configuration ensures Nexus data is stored persistently in NFS.