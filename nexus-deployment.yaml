# Nexus app with resource limits, PVC, and Ingress
# PersistentVolume for Nexus (static hostPath)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nexus-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/data/nexus

---

# PersistentVolumeClaim in 'monitoring' namespace
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-pvc
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
  storageClassName: ""

---

# Nexus Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus
  template:
    metadata:
      labels:
        app: nexus
    spec:
      containers:
      - name: nexus
        image: sonatype/nexus3
        ports:
        - containerPort: 8081
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        volumeMounts:
        - name: nexus-storage
          mountPath: /nexus-data
      volumes:
      - name: nexus-storage
        persistentVolumeClaim:
          claimName: nexus-pvc

---

# Nexus Service
apiVersion: v1
kind: Service
metadata:
  name: nexus-service
  namespace: monitoring
spec:
  selector:
    app: nexus
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8081
  type: LoadBalancer

