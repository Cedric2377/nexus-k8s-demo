# Nexus app with resource limits, PVC, and Ingress
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus
  template:
    metadata:
      labels:
        app: nexus
    spec:
      containers:
      - name: nexus
        image: sonatype/nexus3
        ports:
        - containerPort: 8081
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        volumeMounts:
        - name: nexus-storage
          mountPath: /nexus-data
      volumes:
      - name: nexus-storage
        persistentVolumeClaim:
          claimName: nexus-nfs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-service
spec:
  selector:
    app: nexus
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8081
  type: LoadBalancer
